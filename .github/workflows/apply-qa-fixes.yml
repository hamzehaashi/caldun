name: Apply QA fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-qa-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply audited fixes
        shell: python
        run: |
          from pathlib import Path

          component = Path('src/components/caldun-workspace.tsx')
          text = component.read_text()

          old = "const gs = [-1, -0.5, 0, 0.5, 1].map((delta) => Math.max(0, assumptions.terminal + delta));"
          new = "const gs = [-1, -0.5, 0, 0.5, 1].map((delta) => assumptions.terminal + delta);"
          if old not in text:
              raise SystemExit('Sensitivity pattern not found')
          text = text.replace(old, new, 1)

          old = '''          {result.missingEquityBridge?.length ? (\n            <div className="bridge-warning">Per-share value is withheld because {result.missingEquityBridge.join(' and ')} data is missing.</div>\n          ) : null}'''
          new = '''          {result.missingEquityBridge?.length ? (\n            <div className="bridge-warning">Equity and per-share value are withheld because {result.missingEquityBridge.join(' and ')} data is missing.</div>\n          ) : result.equity != null && !result.shares ? (\n            <div className="bridge-warning">Per-share value is withheld because a valid shares-outstanding value is unavailable.</div>\n          ) : null}'''
          if old not in text:
              raise SystemExit('Valuation warning pattern not found')
          text = text.replace(old, new, 1)
          component.write_text(text)

          css = Path('src/app/globals.css')
          text = css.read_text()
          old = '.source-derived{color:var(--accent2)}'
          new = '.source-derived,.source-derived-adjusted{color:var(--accent2)}'
          if old not in text:
              raise SystemExit('Derived source CSS pattern not found')
          css.write_text(text.replace(old, new, 1))

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/caldun-workspace.tsx src/app/globals.css
          git commit -m "Fix valuation warnings and sensitivity display"
          git push origin HEAD:main
