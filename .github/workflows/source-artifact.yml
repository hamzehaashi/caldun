name: Source Artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-ui:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Run one-shot analyst UI hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply audited UI/model correctness fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/caldun-workspace.tsx')
          s = path.read_text()

          replacements = [
            ("  { key: 'growth', label: 'Revenue growth', min: -5, max: 25, step: 0.5 },", "  { key: 'growth', label: 'Revenue growth', min: -50, max: 100, step: 0.5 },"),
            ("  { key: 'margin', label: 'EBIT margin', min: 0, max: 45, step: 0.5 },", "  { key: 'margin', label: 'EBIT margin', min: -50, max: 60, step: 0.5 },"),
            ("  derived: 'Derived from history',\n  default: 'Default',\n  analyst: 'Analyst-entered',", "  derived: 'Derived from history',\n  'derived-adjusted': 'Derived · constrained',\n  default: 'Default',\n  analyst: 'Analyst-entered',"),
            ("""  const da = latest?.depreciationAndAmortization && latest.revenue
    ? (latest.depreciationAndAmortization / latest.revenue) * 100
    : DEFAULT_ASSUMPTIONS.da;
  const capex = latest?.capex && latest.revenue
    ? (latest.capex / latest.revenue) * 100
    : DEFAULT_ASSUMPTIONS.capex;

  return {
    assumptions: {
      ...DEFAULT_ASSUMPTIONS,
      growth: clamp(growth, -5, 25),
      margin: clamp(margin, 0, 45),
      da: clamp(da, 0, 20),
      capex: clamp(capex, 0, 20),
    },
    sources: {
      growth: latest?.revenue && previous?.revenue ? 'derived' : 'default',
      margin: latest?.operatingMargin != null ? 'derived' : 'default',
      da: latest?.depreciationAndAmortization && latest.revenue ? 'derived' : 'default',
      capex: latest?.capex && latest.revenue ? 'derived' : 'default',
      tax: 'default',
      nwc: 'default',
      wacc: 'default',
      terminal: 'default',
    },
  };
}""", """  const hasDaHistory = latest?.depreciationAndAmortization != null && Boolean(latest.revenue);
  const hasCapexHistory = latest?.capex != null && Boolean(latest.revenue);
  const da = hasDaHistory
    ? (latest!.depreciationAndAmortization! / latest!.revenue!) * 100
    : DEFAULT_ASSUMPTIONS.da;
  const capex = hasCapexHistory
    ? (latest!.capex! / latest!.revenue!) * 100
    : DEFAULT_ASSUMPTIONS.capex;

  const bounded = {
    growth: clamp(growth, -50, 100),
    margin: clamp(margin, -50, 60),
    da: clamp(da, 0, 20),
    capex: clamp(capex, 0, 20),
  };

  const derivedSource = (raw: number, adjusted: number, available: boolean): AssumptionSource =>
    !available ? 'default' : Math.abs(raw - adjusted) > 1e-9 ? 'derived-adjusted' : 'derived';

  return {
    assumptions: { ...DEFAULT_ASSUMPTIONS, ...bounded },
    sources: {
      growth: derivedSource(growth, bounded.growth, Boolean(latest?.revenue && previous?.revenue)),
      margin: derivedSource(margin, bounded.margin, latest?.operatingMargin != null),
      da: derivedSource(da, bounded.da, hasDaHistory),
      capex: derivedSource(capex, bounded.capex, hasCapexHistory),
      tax: 'default',
      nwc: 'default',
      wacc: 'default',
      terminal: 'default',
    },
  };
}"""),
            ("""      const response = await fetch(`/api/company?ticker=${encodeURIComponent(normalized)}`);
      const data = await response.json() as CompanyData & { error?: string };
      if (!response.ok) throw new Error(data.error || 'Unable to load company.');
      if (!data.financials?.length) {""", """      const response = await fetch(`/api/company?ticker=${encodeURIComponent(normalized)}`);
      const body = await response.text();
      let data: (CompanyData & { error?: string }) | null = null;

      if (body) {
        try {
          data = JSON.parse(body) as CompanyData & { error?: string };
        } catch {
          throw new Error(
            response.ok
              ? 'CALDUN received an unexpected response from the data service.'
              : `CALDUN data service returned HTTP ${response.status}.`,
          );
        }
      }

      if (!response.ok) throw new Error(data?.error || `Unable to load company (HTTP ${response.status}).`);
      if (!data) throw new Error('CALDUN received an empty response from the data service.');
      if (!data.financials?.length) {"""),
            ('US SEC filers supported. Annual fundamentals are normalized from SEC Company Facts.', 'US-GAAP SEC filers supported. Annual fundamentals are normalized from SEC Company Facts.'),
            ("<thead><tr><th>WACC ↓ / g →</th>{gs.map((g) => <th key={g}>{g.toFixed(1)}%</th>)}</tr></thead>", "<thead><tr><th>WACC ↓ / g →</th>{gs.map((g, gi) => <th key={`${g}-${gi}`}>{g.toFixed(1)}%</th>)}</tr></thead>"),
            ("return <td className={wi === 2 && gi === 2 ? 'center' : ''} key={g}>{fmtPerShare(sensitivity.perShare)}</td>;", "return <td className={wi === 2 && gi === 2 ? 'center' : ''} key={`${g}-${gi}`}>{fmtPerShare(sensitivity.perShare)}</td>;"),
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Expected source block not found: {old[:120]!r}')
            s = s.replace(old, new, 1)

          path.write_text(s)
          PY

      - name: Install and verify patched tree
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
        env:
          SEC_USER_AGENT: CALDUN-CI ci@example.invalid

      - name: Commit patched workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/caldun-workspace.tsx
          git commit -m "Harden analyst assumptions and error handling"
          git push origin HEAD:main

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload repository source
        uses: actions/upload-artifact@v4
        with:
          name: caldun-source
          path: |
            .
            !.git
            !node_modules
            !.next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
