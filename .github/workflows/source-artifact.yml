name: Source Artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload repository source
        uses: actions/upload-artifact@v4
        with:
          name: caldun-source
          path: |
            .
            !.git
            !node_modules
            !.next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
