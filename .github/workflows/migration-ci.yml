name: Migration CI

on:
  push:
    branches:
      - nextjs-typescript-migration
  pull_request:
    branches:
      - phase-0-correctness
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run regression tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          SEC_USER_AGENT: CALDUN-CI ci@example.invalid

      - name: Commit generated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/nextjs-typescript-migration'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Add dependency lockfile"
            git push origin HEAD:nextjs-typescript-migration
          else
            echo "package-lock.json is already current."
          fi

      - name: Save generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
