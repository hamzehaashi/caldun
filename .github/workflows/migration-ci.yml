name: Caldun CI

on:
  push:
    branches:
      - main
      - nextjs-typescript-migration
  pull_request:
    branches:
      - phase-0-correctness
      - main

permissions:
  contents: write

jobs:
  patch-ui:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Trigger audited UI hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply audited UI/model correctness fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/caldun-workspace.tsx')
          s = path.read_text()

          replacements = [
            (
              "  { key: 'growth', label: 'Revenue growth', min: -5, max: 25, step: 0.5 },",
              "  { key: 'growth', label: 'Revenue growth', min: -50, max: 100, step: 0.5 },",
            ),
            (
              "  { key: 'margin', label: 'EBIT margin', min: 0, max: 45, step: 0.5 },",
              "  { key: 'margin', label: 'EBIT margin', min: -50, max: 60, step: 0.5 },",
            ),
            (
              "  derived: 'Derived from history',\n  default: 'Default',\n  analyst: 'Analyst-entered',",
              "  derived: 'Derived from history',\n  'derived-adjusted': 'Derived · constrained',\n  default: 'Default',\n  analyst: 'Analyst-entered',",
            ),
            (
              """  const da = latest?.depreciationAndAmortization && latest.revenue
    ? (latest.depreciationAndAmortization / latest.revenue) * 100
    : DEFAULT_ASSUMPTIONS.da;
  const capex = latest?.capex && latest.revenue
    ? (latest.capex / latest.revenue) * 100
    : DEFAULT_ASSUMPTIONS.capex;

  return {
    assumptions: {
      ...DEFAULT_ASSUMPTIONS,
      growth: clamp(growth, -5, 25),
      margin: clamp(margin, 0, 45),
      da: clamp(da, 0, 20),
      capex: clamp(capex, 0, 20),
    },
    sources: {
      growth: latest?.revenue && previous?.revenue ? 'derived' : 'default',
      margin: latest?.operatingMargin != null ? 'derived' : 'default',
      da: latest?.depreciationAndAmortization && latest.revenue ? 'derived' : 'default',
      capex: latest?.capex && latest.revenue ? 'derived' : 'default',
      tax: 'default',
      nwc: 'default',
      wacc: 'default',
      terminal: 'default',
    },
  };
}""",
              """  const hasDaHistory = latest?.depreciationAndAmortization != null && Boolean(latest.revenue);
  const hasCapexHistory = latest?.capex != null && Boolean(latest.revenue);
  const da = hasDaHistory
    ? (latest!.depreciationAndAmortization! / latest!.revenue!) * 100
    : DEFAULT_ASSUMPTIONS.da;
  const capex = hasCapexHistory
    ? (latest!.capex! / latest!.revenue!) * 100
    : DEFAULT_ASSUMPTIONS.capex;

  const bounded = {
    growth: clamp(growth, -50, 100),
    margin: clamp(margin, -50, 60),
    da: clamp(da, 0, 20),
    capex: clamp(capex, 0, 20),
  };

  const derivedSource = (raw: number, adjusted: number, available: boolean): AssumptionSource =>
    !available ? 'default' : Math.abs(raw - adjusted) > 1e-9 ? 'derived-adjusted' : 'derived';

  return {
    assumptions: {
      ...DEFAULT_ASSUMPTIONS,
      ...bounded,
    },
    sources: {
      growth: derivedSource(growth, bounded.growth, Boolean(latest?.revenue && previous?.revenue)),
      margin: derivedSource(margin, bounded.margin, latest?.operatingMargin != null),
      da: derivedSource(da, bounded.da, hasDaHistory),
      capex: derivedSource(capex, bounded.capex, hasCapexHistory),
      tax: 'default',
      nwc: 'default',
      wacc: 'default',
      terminal: 'default',
    },
  };
}""",
            ),
            (
              """      const response = await fetch(`/api/company?ticker=${encodeURIComponent(normalized)}`);
      const data = await response.json() as CompanyData & { error?: string };
      if (!response.ok) throw new Error(data.error || 'Unable to load company.');
      if (!data.financials?.length) {""",
              """      const response = await fetch(`/api/company?ticker=${encodeURIComponent(normalized)}`);
      const body = await response.text();
      let data: (CompanyData & { error?: string }) | null = null;

      if (body) {
        try {
          data = JSON.parse(body) as CompanyData & { error?: string };
        } catch {
          throw new Error(
            response.ok
              ? 'CALDUN received an unexpected response from the data service.'
              : `CALDUN data service returned HTTP ${response.status}.`,
          );
        }
      }

      if (!response.ok) throw new Error(data?.error || `Unable to load company (HTTP ${response.status}).`);
      if (!data) throw new Error('CALDUN received an empty response from the data service.');
      if (!data.financials?.length) {""",
            ),
            (
              'US SEC filers supported. Annual fundamentals are normalized from SEC Company Facts.',
              'US-GAAP SEC filers supported. Annual fundamentals are normalized from SEC Company Facts.',
            ),
            (
              "<thead><tr><th>WACC ↓ / g →</th>{gs.map((g) => <th key={g}>{g.toFixed(1)}%</th>)}</tr></thead>",
              "<thead><tr><th>WACC ↓ / g →</th>{gs.map((g, gi) => <th key={`${g}-${gi}`}>{g.toFixed(1)}%</th>)}</tr></thead>",
            ),
            (
              "return <td className={wi === 2 && gi === 2 ? 'center' : ''} key={g}>{fmtPerShare(sensitivity.perShare)}</td>;",
              "return <td className={wi === 2 && gi === 2 ? 'center' : ''} key={`${g}-${gi}`}>{fmtPerShare(sensitivity.perShare)}</td>;",
            ),
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Expected source block not found:\n{old[:160]}')
            s = s.replace(old, new, 1)

          path.write_text(s)
          PY

      - name: Install and verify patched tree
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
        env:
          SEC_USER_AGENT: CALDUN-CI ci@example.invalid

      - name: Commit patched workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/caldun-workspace.tsx
          git commit -m "Harden analyst assumptions and error handling"
          git push origin HEAD:main

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run regression tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          SEC_USER_AGENT: CALDUN-CI ci@example.invalid

      - name: Runtime smoke test
        shell: bash
        env:
          SEC_USER_AGENT: CALDUN-CI ci@example.invalid
        run: |
          npm run start > /tmp/caldun-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/caldun-home.html; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/caldun-next.log
            exit 1
          fi

          grep -q "Understand the business" /tmp/caldun-home.html

          STATUS=$(curl --silent --show-error --output /tmp/caldun-invalid.json --write-out "%{http_code}" "http://127.0.0.1:3000/api/company?ticker=!!!")
          test "$STATUS" = "400"
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('/tmp/caldun-invalid.json','utf8')); if (!data.error) process.exit(1);"

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Allow Netlify production deployment to publish
        run: sleep 55

      - name: Verify live homepage
        run: |
          curl --fail --silent --show-error --max-time 20 https://caldun.netlify.app/ > /tmp/caldun-home.html
          grep -q "Understand the business" /tmp/caldun-home.html

      - name: Verify live real-company fundamentals
        shell: bash
        run: |
          set -euo pipefail

          for TICKER in AAPL MSFT WMT; do
            OK=0
            for ATTEMPT in 1 2 3; do
              STATUS=$(curl --silent --show-error --max-time 25 \
                --output "/tmp/${TICKER}.json" \
                --write-out "%{http_code}" \
                "https://caldun.netlify.app/api/company?ticker=${TICKER}" || true)

              if [ "$STATUS" = "200" ]; then
                TICKER="$TICKER" node -e "const fs=require('fs'); const ticker=process.env.TICKER; const data=JSON.parse(fs.readFileSync('/tmp/'+ticker+'.json','utf8')); if(data.ticker!==ticker) throw new Error('Ticker mismatch'); if(!Array.isArray(data.financials)||data.financials.length<3) throw new Error('Insufficient financial history'); const usable=data.financials.filter((row)=>Number.isFinite(row.revenue)); if(usable.length<3) throw new Error('Insufficient revenue history'); if(!data.balanceSheet||typeof data.balanceSheet!=='object') throw new Error('Missing balance sheet'); if(!String(data.source||'').includes('SEC')) throw new Error('Unexpected source');"
                OK=1
                break
              fi

              echo "${TICKER} attempt ${ATTEMPT} returned HTTP ${STATUS}:"
              cat "/tmp/${TICKER}.json" || true
              echo
              sleep 15
            done

            if [ "$OK" -ne 1 ]; then
              echo "Production ticker smoke test failed for ${TICKER}."
              exit 1
            fi
          done
